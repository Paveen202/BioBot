<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ec">
  <title>Battle Arena — Bio City</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f5f4ec}main,iframe{width:100%;height:100%;border:0;display:block}iframe{position:fixed;inset:0}
  </style>
</head>
<body>
  <main><iframe id="battleView" title="Bio City battle arena" allow="fullscreen"></iframe></main>
  <script>
    const query = new URLSearchParams(location.search);
    query.set("battle", "1");
    document.getElementById("battleView").src = `bio-city.html?${query.toString()}`;
    window.addEventListener("message", event => {
      if (event.origin !== location.origin || event.data?.type !== "biocity-exit-battle") return;
      location.href = "bio-city.html#battleScreen";
    });
  </script>
</body>
</html>
